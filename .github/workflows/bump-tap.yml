name: bump-tap
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to bump the tap to (e.g. v0.3.0)'
        required: true

permissions:
  contents: read

jobs:
  bump:
    runs-on: ubuntu-latest
    env:
      BUMP_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: Homebrew/actions/setup-homebrew@master
      - name: Update tap formula and push
        env:
          TAP_TOKEN: ${{ secrets.TAP_PUSH_TOKEN }}
        run: |
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "::error::TAP_PUSH_TOKEN secret is not set in mstdokumaci/zsort → Settings → Secrets and variables → Actions" >&2
            exit 1
          fi
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          brew update
          brew tap mstdokumaci/homebrew-zsort
          cd "$(brew --repo mstdokumaci/homebrew-zsort)"
          brew bump-formula-pr --write-only --no-audit \
            --url "https://github.com/mstdokumaci/zsort/archive/refs/tags/${BUMP_TAG}.tar.gz" \
            mstdokumaci/zsort/zsort
          git add -A
          git commit -m "zsort ${BUMP_TAG}"
          git push "https://x-access-token:${TAP_TOKEN}@github.com/mstdokumaci/homebrew-zsort.git" HEAD:main
