name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    strategy:
      fail-fast: false
      matrix:
        zig: [0.15.2, 0.16.0]
    runs-on: ubuntu-latest
    env:
      ZLINT_VERSION: v0.9.1
      ZWANZIG_VERSION: v0.14.0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ matrix.zig }}
      - name: Install zlint (pinned)
        if: matrix.zig == '0.15.2'
        run: |
          curl -fsSL -o /tmp/zlint "https://github.com/DonIsaac/zlint/releases/download/${ZLINT_VERSION}/zlint-linux-x86_64"
          echo "3290bd511d37e4f6ccca3621b9894cd6c378195cdaac27520d0bd894058b2b9b  /tmp/zlint" | sha256sum --check -
          chmod +x /tmp/zlint
          sudo mv /tmp/zlint /usr/local/bin/zlint
      - name: Install zwanzig (pinned)
        if: matrix.zig == '0.15.2'
        run: |
          curl -fsSL -o /tmp/zwanzig.tar.gz "https://github.com/forketyfork/zwanzig/releases/download/${ZWANZIG_VERSION}/zwanzig-${ZWANZIG_VERSION}-linux-x86_64.tar.gz"
          echo "4667f5f0635b27362a4c9340aa971318f71e5aee778bd5302e88c008e5ce368d  /tmp/zwanzig.tar.gz" | sha256sum --check -
          mkdir -p /tmp/zwanzig
          tar -xzf /tmp/zwanzig.tar.gz -C /tmp/zwanzig
          sudo mv /tmp/zwanzig/zwanzig /usr/local/bin/zwanzig
      - name: Zig gates (check-imports, fmt, compile)
        run: |
          zig build check-imports
          zig fmt --check src
          zig build check --summary all
      - name: External linters (zlint, zwanzig)
        if: matrix.zig == '0.15.2'
        run: |
          zlint --deny-warnings
          zwanzig src build.zig

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, zig: 0.15.2 }
          - { os: ubuntu-latest, zig: 0.16.0 }
          - { os: macos-15, zig: 0.15.2 }
          - { os: macos-latest, zig: 0.16.0 }
          - { os: macos-15-intel, zig: 0.15.2 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ matrix.zig }}
      - run: zig build test --summary all
      - run: zig build check --summary all

  precommit-hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build and install zsort
        run: |
          zig build -Doptimize=ReleaseFast
          sudo install -m 0755 zig-out/bin/zsort /usr/local/bin/zsort
      - name: Validate manifest and exercise hooks
        run: |
          pip install pre-commit
          pre-commit validate-manifest .pre-commit-hooks.yaml
          if pre-commit try-repo . zsort --files test/consumer/src/main.zig; then
            echo "expected 'zsort' hook to fail on the unsorted fixture" >&2
            exit 1
          fi
          pre-commit try-repo . zsort-fix --files test/consumer/src/main.zig
          pre-commit try-repo . zsort --files test/consumer/src/main.zig

  package-consumer:
    strategy:
      fail-fast: false
      matrix:
        zig: [0.15.2, 0.16.0]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ matrix.zig }}
      - name: Exercise zsort as a package dependency
        run: |
          set -euo pipefail
          cd test/consumer
          zig build fix-imports
          zig build check-imports
          if git diff --quiet -- src; then
            echo "expected fix-imports to modify the unsorted fixture" >&2
            exit 1
          fi
          git checkout -- src
          if zig build check-imports; then
            echo "expected check-imports to fail on the unsorted fixture" >&2
            exit 1
          fi
